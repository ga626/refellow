name: Refellow Pages deployment
on:
  workflow_dispatch:
    inputs:
      target:
        description: 部署到开发版或正式版
        type: choice
        options: [preview, production]
        required: true
      run_id:
        description: 已成功的 PR quality CI 运行号
        type: string
        required: true
      approved_package_hash:
        description: 正式发布时填写已确认验收的开发版完整包摘要
        type: string
        required: false
      closeout_authorized:
        description: 仅用户明确要求创建PR并完成收口时确认；普通开发不得选正式版
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: refellow-pages-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare official deployment CLI
        run: npm install --prefix "$RUNNER_TEMP/refellow-wrangler" --no-save --no-audit --no-fund wrangler@4.124.0
      - name: Verify candidate and deploy the same artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_TARGET: ${{ inputs.target }}
          CANDIDATE_RUN: ${{ inputs.run_id }}
          APPROVED_PACKAGE_HASH: ${{ inputs.approved_package_hash }}
          CLOSEOUT_AUTHORIZED: ${{ inputs.closeout_authorized }}
        shell: bash
        run: |
          export REFELLOW_WRANGLER_JS="$RUNNER_TEMP/refellow-wrangler/node_modules/wrangler/bin/wrangler.js"
          arguments=(--target "$DEPLOY_TARGET" --run "$CANDIDATE_RUN" --execute)
          if test "$DEPLOY_TARGET" = production; then
            test "$CLOSEOUT_AUTHORIZED" = true || { echo '正式部署需要明确授权的 PR 收口'; exit 1; }
            arguments+=(--closeout --approve-preview "$APPROVED_PACKAGE_HASH")
          fi
          node scripts/deploy-pages.mjs "${arguments[@]}"
      - name: Keep deployment verification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pages-deployment-${{ github.run_id }}
          path: local/verification/pages-deployment/
          if-no-files-found: ignore
          retention-days: 14
