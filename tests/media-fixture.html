<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>录制文件测试夹具</title></head><body><h1>合成测试媒体，不是网站效果实拍</h1><p>仅用于验证视频上传、存储、播放和导出；不能证明扩展真实网页录制成功。</p><canvas id="canvas" width="640" height="360"></canvas><button id="generate">生成3秒测试视频</button><a id="download" hidden>下载测试WebM</a><p id="status"></p><script>
document.querySelector('#generate').onclick=async()=>{const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),chunks=[],stream=canvas.captureStream(12),recorder=new MediaRecorder(stream,{mimeType:'video/webm',videoBitsPerSecond:300000});let frame=0,link;const paint=()=>{ctx.fillStyle='#eef2ff';ctx.fillRect(0,0,640,360);ctx.fillStyle='#2455e8';ctx.beginPath();ctx.arc(100+frame%300,180,45,0,Math.PI*2);ctx.fill();ctx.fillStyle='#18243b';ctx.font='28px sans-serif';ctx.fillText('SYNTHETIC QA — NOT A REAL SITE CAPTURE',20,55);frame+=8;};paint();const timer=setInterval(paint,80);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{clearInterval(timer);stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:'video/webm'});link=URL.createObjectURL(blob);const a=document.querySelector('#download');a.href=link;a.download='synthetic-qa.webm';a.hidden=false;document.querySelector('#status').textContent='测试视频已生成 '+blob.size+' bytes';};recorder.start();setTimeout(()=>recorder.stop(),3000);};
</script></body></html>
