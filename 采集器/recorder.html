<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>录一段 · Refellow · 参伴</title><link rel="stylesheet" href="capture.css"><script type="module" src="recorder.js"></script></head>
<body class="recorder"><header><div class="brand"><img src="icons/icon-48.png" width="28" height="28" alt=""><strong>Refellow <span class="brand-cn">参伴</span></strong></div><span class="local-badge">静音录制</span></header><main>
<h1>把这段感觉，留住。</h1><p class="hint">点一下开始，选好共享网页；再点同一个按钮停止。时长由你决定，单段最多 2 分钟 / 12MB。</p>
<div class="record-console"><div class="record-meter"><span id="record-dot" class="record-dot"></span><span id="record-state">准备好了</span><output id="elapsed" aria-label="已录时长">00:00</output></div><button id="toggle-record" class="primary record-toggle" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle class="record-symbol" cx="12" cy="12" r="6"/><rect class="stop-symbol" x="6" y="6" width="12" height="12" rx="2"/></svg><span id="toggle-label">开始录制</span></button><button id="cancel" class="quiet" hidden>取消本次录制</button><p class="hint">不录音。结束后先预览，再保存。</p></div>
<p id="status" role="status" aria-live="polite"></p><label>这段画面的原网址<input id="url" type="url" required maxlength="2048"></label><label>名称（选填）<input id="title" maxlength="120"></label>
<section id="review" hidden><h2>保存前，看一眼</h2><video id="preview" class="recorder-preview" controls playsinline muted></video><label class="confirmation"><input id="confirmed" type="checkbox">我确认画面来自上面的网址，且没有要隐藏的私人信息。</label><button id="save" class="primary" disabled>存到收件箱</button><p class="hint">共享目标的网址无法自动读取，请核对。关闭录制窗前请保存。</p></section><p id="recipe" class="hint"></p></main></body></html>
