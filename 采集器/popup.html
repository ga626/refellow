<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随看随收 · Refellow · 参伴</title><link rel="stylesheet" href="capture.css"><script type="module" src="capture.js"></script></head>
<body class="popup"><header><a id="home" class="brand" href="https://refellow.pages.dev/#collection"><img src="icons/icon-48.png" width="28" height="28" alt=""><strong>Refellow <span class="brand-cn">参伴</span></strong></a><span class="local-badge">本地保存</span></header><main>
<div class="capture-intro"><h1>看中了，先收下。</h1><p class="hint">留下画面和出处，稍后慢慢整理。</p></div>
<div class="capture-actions"><button id="shot" class="primary capture-action"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l1-2h6l1 2h4v14H4V5z"/><circle cx="12" cy="12" r="4"/></svg><span>截一张<small>保存可见画面</small></span></button><button id="record" class="capture-action"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="M16 9l5-3v12l-5-3"/></svg><span>录一段<small>自己决定停在哪</small></span></button></div>
<p id="status" role="status" aria-live="polite"></p><p id="mode" class="hint permission-note"></p>
<p class="hint privacy-note">静音录制 · 手动停止 · 不上传云端</p>
<details id="manual"><summary>只记网址 / 手动补充</summary><form id="save-link"><label>具体网址<input name="url" id="url" required type="url" placeholder="https://…" maxlength="2048"></label><label>名称（选填）<input name="title" id="title" maxlength="120"></label><label>发现入口（选填）<input name="discoveryURL" type="url" placeholder="在哪个精选网站发现的？" maxlength="2048"></label><button class="primary" type="submit">先存到收件箱</button></form></details>
<p id="recipe" class="hint"></p><div class="utility"><a href="sidepanel.html#inbox" id="inbox-link"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM4 13h5l1 3h4l1-3h5"/></svg>收件箱 <span id="count">0</span></a><button id="open-panel" class="quiet">打开侧栏 <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button></div>
</main></body></html>
