<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接参伴账户</title><link rel="stylesheet" href="connect.css"><script type="module" src="connect.js"></script></head><body><main><header><img src="icons/icon-32.png" alt="" width="28" height="28"><span>参伴 <small>Refellow</small></span></header><h1>连接你的个人空间</h1><p>先在网站注册或登录，再生成连接码。只需连接一次，之后截图和录像直接进入“我的收藏”。</p><form id="connect"><label for="environment">保存到哪里<select id="environment"><option value="production">正式网站</option><option value="local">本机测试空间</option><option value="preview">线上测试网站</option></select></label><label id="origin-field" hidden>测试网站地址<input id="origin" name="origin" type="url" value="https://lingganji.pages.dev" required></label><p id="environment-note">正式账户与本机测试账户相互独立。</p><a id="site-link" href="https://lingganji.pages.dev/#account" target="_blank" rel="noopener">打开网站，登录并生成连接码</a><label for="pair-code">一次性连接码<input id="pair-code" name="code" autocomplete="off" spellcheck="false" placeholder="在这里粘贴连接码" required aria-describedby="code-hint"></label><p id="code-hint">连接码5分钟内有效，只能使用一次。请勿填写账户密码。</p><button type="submit">连接账户</button></form><p id="status" role="status" aria-live="polite"></p><button id="disconnect" hidden>断开当前账户</button></main></body></html>
