<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参伴账户</title><link rel="stylesheet" href="connect.css"><script type="module" src="connect.js"></script></head><body><main><header><img src="icons/icon-32.png" alt="" width="28" height="28"><span>参伴 <small>Refellow</small></span></header><h1>登录一次，随看随收。</h1><p>在参伴网站登录，采集器会自动识别账户。截图和录像直接进入“我的收藏”。</p><form id="connect"><label for="environment">打开网站<select id="environment"><option value="production">正式网站</option><option value="local">本机开发网站</option><option value="preview">线上测试网站</option></select></label><label id="origin-field" hidden>固定测试网站<input id="origin" type="url" readonly value="https://preview.refellow.pages.dev"></label><p id="environment-note">正式站、测试站与本机账户相互独立。</p><button type="submit">前往网站登录</button></form><p id="status" role="status"></p></main></body></html>
