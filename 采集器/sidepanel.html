<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>采集收件箱 · Refellow · 参伴</title><link rel="stylesheet" href="capture.css"><script type="module" src="desk.js"></script></head><body>
<header><a id="home" class="brand" href="https://refellow.pages.dev/#collection"><img src="icons/icon-48.png" width="28" height="28" alt=""><strong>Refellow <span class="brand-cn">参伴</span></strong></a><span class="local-badge">先收，后整理</span></header>
<nav class="tabs" aria-label="采集器功能"><button data-tab="capture" aria-pressed="true">轻采集</button><button data-tab="inbox" aria-pressed="false">收件箱 <span id="count">0</span></button><button data-tab="directory" aria-pressed="false">网站</button></nav>
<main><p id="status" role="status" aria-live="polite"></p><section id="capture-pane"><h1>看中了，就先收下。</h1><iframe title="轻量采集操作" src="popup.html" class="capture-frame"></iframe></section>
<section id="inbox-pane" hidden><h1>刚刚收下的</h1><p class="hint">导出带截图和视频的采集包，到工作台确认导入。名称、分类、借鉴点在那里整理。不自动删除本地记录。</p><button id="export-all" class="primary">导出采集包（含媒体）</button><div id="inbox"></div><button id="undo" hidden>撤销刚才的移除</button></section>
<section id="directory-pane" hidden><h1>下一站，去哪里？</h1><label>搜索网站<input id="site-search" type="search" placeholder="名称或用途"></label><div id="sites"></div><details><summary>工作台地址与个人目录</summary><p class="hint">工作台“采集工具”导出目录配置，再在这里导入。不会携带你的收藏或账号。</p><label>导入目录配置<input id="context-file" type="file" accept="application/json,.json"></label></details></section>
</main></body></html>
